<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de trading</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#6b7280;--ln:#e5e7eb;--ac:#2563eb;--gn:#16a34a;--rd:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#181e27;--tx:#e8ecf1;--mu:#8b95a5;--ln:#2a323e}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}
header{padding:14px 16px;font-weight:700;font-size:18px}
main{padding:0 12px;max-width:560px;margin:auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.sec{background:var(--ln);color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{background:none;color:var(--mu);border-radius:0;margin:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--ac)}
.big{font-size:22px;font-weight:700}
.g{color:var(--gn)}.r{color:var(--rd)}.mu{color:var(--mu);font-size:13px}
.stats{display:flex;gap:8px}.stats>div{flex:1}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar span:first-child{width:78px;color:var(--mu)}
.bar i{display:block;height:10px;border-radius:5px}
.bar .t{flex:1}.bar span:last-child{width:70px;text-align:right}
.tr{padding:10px 0;border-bottom:1px solid var(--ln)}.tr:last-child{border:0}
.tr .h{display:flex;justify-content:space-between;font-weight:600}
#msg{font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header>📈 Journal de trading</header>
<main>

<section id="add" class="on">
  <div class="card">
    <button id="pick">➕ Ajouter un trade</button>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="msg" class="mu"></div>
  </div>

  <form id="form" class="card" hidden>
    <div class="mu">Vérifie et corrige avant d'enregistrer.</div>
    <div class="row">
      <div><label>Actif</label><input id="symbol" required></div>
      <div><label>Type</label><select id="side"><option>Buy</option><option>Sell</option></select></div>
    </div>
    <div class="row">
      <div><label>Prix d'ouverture</label><input id="open" type="number" step="any"></div>
      <div><label>Prix de clôture</label><input id="close" type="number" step="any"></div>
    </div>
    <div class="row">
      <div><label>Lot</label><input id="vol" type="number" step="any"></div>
      <div><label>Résultat net (USD)</label><input id="profit" type="number" step="any" required></div>
    </div>
    <label>Date et heure</label><input id="dt" type="datetime-local" required>
    <label>Humeur (optionnel)</label>
    <select id="mood"><option value="">—</option><option>Calme</option><option>Confiant</option><option>Neutre</option><option>Fatigué</option><option>Stressé</option><option>FOMO</option><option>Revanche</option><option>Euphorique</option></select>
    <label>Note sur le setup (optionnel)</label><textarea id="note" rows="3"></textarea>
    <button type="submit">💾 Enregistrer</button>
    <button type="button" id="cancel" class="sec">Annuler</button>
  </form>

  <div class="card">
    <label>Clé API Anthropic (stockée sur cet appareil)</label>
    <input id="key" type="password" placeholder="sk-ant-...">
  </div>
</section>

<section id="dash"></section>
<section id="hist"></section>

</main>
<nav>
  <button data-t="add" class="on">Ajouter</button>
  <button data-t="dash">Dashboard</button>
  <button data-t="hist">Historique</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const MODEL="claude-sonnet-5-5";
const PROMPT=`Tu lis une capture d'écran de trading (MetaTrader 5, broker ou récap).
Réponds UNIQUEMENT par un objet JSON, sans texte ni backticks, avec ces clés :
symbol (ex: XAUUSD), side ("Buy" ou "Sell"), open_price, close_price, volume (lots), profit (résultat net, négatif si perte), currency, opened_at (ISO 8601 ex 2026-11-10T14:32:00 ou null).
Valeur illisible = null. N'invente rien.`;

let trades=[];
try{trades=JSON.parse(localStorage.getItem("trades")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("trades",JSON.stringify(trades))}catch(e){alert("Stockage plein")}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(n>=0?"+":"")+n.toFixed(2)+" $";

$("#key").value=localStorage.getItem("apikey")||"";
$("#key").onchange=e=>localStorage.setItem("apikey",e.target.value.trim());

// Onglets
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
  render();
});

// Capture
$("#pick").onclick=()=>{
  if(!localStorage.getItem("apikey")){$("#msg").textContent="Saisis d'abord ta clé API ci-dessous.";return}
  $("#file").click();
};

function toJpeg(file){return new Promise((ok,ko)=>{
  const fr=new FileReader();
  fr.onerror=ko;
  fr.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{
    const k=Math.min(1,1600/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    ok(c.toDataURL("image/jpeg",0.85));
  };im.src=fr.result};
  fr.readAsDataURL(file);
})}

async function extract(dataUrl){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":localStorage.getItem("apikey"),
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({model:MODEL,max_tokens:600,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data:dataUrl.split(",")[1]}},
      {type:"text",text:PROMPT}
    ]}]})
  });
  const j=await r.json();
  if(j.error)throw new Error(j.error.message);
  const t=j.content.filter(c=>c.type==="text").map(c=>c.text).join("");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
}

$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $("#msg").textContent="Lecture de la capture...";
  try{
    const d=await extract(await toJpeg(f));
    $("#symbol").value=d.symbol||"";
    $("#side").value=d.side==="Sell"?"Sell":"Buy";
    $("#open").value=d.open_price??"";
    $("#close").value=d.close_price??"";
    $("#vol").value=d.volume??"";
    $("#profit").value=d.profit??"";
    const base=d.opened_at?new Date(d.opened_at):new Date();
    const dt=isNaN(base)?new Date():base;
    $("#dt").value=new Date(dt-dt.getTimezoneOffset()*6e4).toISOString().slice(0,16);
    $("#mood").value="";$("#note").value="";
    $("#form").hidden=false;$("#msg").textContent="";
  }catch(err){$("#msg").textContent="Échec : "+err.message}
  e.target.value="";
};

$("#cancel").onclick=()=>{$("#form").hidden=true};

$("#form").onsubmit=e=>{
  e.preventDefault();
  trades.push({
    id:Date.now(),
    symbol:$("#symbol").value.toUpperCase().trim(),
    side:$("#side").value,
    open:parseFloat($("#open").value)||null,
    close:parseFloat($("#close").value)||null,
    vol:parseFloat($("#vol").value)||null,
    profit:parseFloat($("#profit").value)||0,
    dt:$("#dt").value,
    mood:$("#mood").value,
    note:$("#note").value.trim()
  });
  save();$("#form").hidden=true;$("#msg").textContent="Trade enregistré ✅";
};

// Dashboard & historique
function wk(s){
  const d=new Date(s),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+"-S"+String(Math.ceil(((t-y)/864e5+1)/7)).padStart(2,"0");
}
function group(keyFn){
  const m={};trades.forEach(t=>{const k=keyFn(t);m[k]=(m[k]||0)+t.profit});
  return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
}
function bars(rows){
  const mx=Math.max(1,...rows.map(r=>Math.abs(r[1])));
  return rows.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="t"><i style="width:${Math.abs(v)/mx*100}%;background:var(${v>=0?"--gn":"--rd"})"></i></div><span class="${v>=0?"g":"r"}">${money(v)}</span></div>`).join("")||'<div class="mu">Aucune donnée</div>';
}

function render(){
  const tot=trades.reduce((s,t)=>s+t.profit,0);
  const wr=trades.length?Math.round(trades.filter(t=>t.profit>0).length/trades.length*100):0;
  $("#dash").innerHTML=`
    <div class="card stats">
      <div><div class="mu">P&amp;L total</div><div class="big ${tot>=0?"g":"r"}">${money(tot)}</div></div>
      <div><div class="mu">Trades</div><div class="big">${trades.length}</div></div>
      <div><div class="mu">Win rate</div><div class="big">${wr} %</div></div>
    </div>
    <div class="card"><b>Par jour</b>${bars(group(t=>t.dt.slice(0,10)))}</div>
    <div class="card"><b>Par semaine</b>${bars(group(t=>wk(t.dt)))}</div>`;

  const list=[...trades].sort((a,b)=>b.dt.localeCompare(a.dt));
  $("#hist").innerHTML=`<div class="card">${list.map(t=>`
    <div class="tr">
      <div class="h"><span>${esc(t.symbol)} · ${t.side}${t.vol?" · "+t.vol+" lot":""}</span><span class="${t.profit>=0?"g":"r"}">${money(t.profit)}</span></div>
      <div class="mu">${esc(t.dt.replace("T"," "))}${t.open!=null?" · "+t.open+" → "+(t.close??"?"):""}${t.mood?" · "+esc(t.mood):""}</div>
      ${t.note?`<div class="mu">${esc(t.note)}</div>`:""}
      <div class="mu" style="text-align:right"><a href="#" data-del="${t.id}" style="color:var(--rd)">Supprimer</a></div>
    </div>`).join("")||'<div class="mu">Historique vide</div>'}</div>`;
  document.querySelectorAll("[data-del]").forEach(a=>a.onclick=e=>{
    e.preventDefault();
    if(confirm("Supprimer ce trade ?")){trades=trades.filter(t=>t.id!=a.dataset.del);save();render()}
  });
}
render();
</script>
</body>
</html>
